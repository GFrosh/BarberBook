{% extends 'base.html' %}
{% block title %}Login · BarberBook{% endblock %}
{% block content %}
<section class="section">
  <div class="form-wrap">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to manage your bookings.</p>
    <form id="loginForm">
      <div class="form-group"><label>Username or email</label><input type="text" class="form-control" name="username" required autofocus></div>
      <div class="form-group"><label>Password</label><input type="password" class="form-control" name="password" required></div>
      <button class="btn btn-primary btn-block">Sign in</button>
      <p class="muted text-center mt-2">No account yet? <a href="/register/">Create one</a></p>
    </form>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const r = await BB.login({ username: fd.get('username'), password: fd.get('password') });
    BB.setTokens(r.tokens); BB.setUser(r.user);
    toast('Welcome, ' + r.user.username, 'success');
    const next = new URLSearchParams(location.search).get('next') || '/dashboard/';
    setTimeout(()=> location.href = next, 400);
  } catch (err) { toast(err.message || 'Login failed', 'error'); }
});
</script>
{% endblock %}
