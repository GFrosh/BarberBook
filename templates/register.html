{% extends 'base.html' %}
{% block title %}Sign Up · BarberBook{% endblock %}
{% block content %}
<section class="section">
  <div class="form-wrap">
    <h1>Create your account</h1>
    <p class="sub">Become a regular in less than a minute.</p>
    <form id="regForm">
      <div class="form-row">
        <div class="form-group"><label>First name</label><input class="form-control" name="first_name"></div>
        <div class="form-group"><label>Last name</label><input class="form-control" name="last_name"></div>
      </div>
      <div class="form-group"><label>Username</label><input class="form-control" name="username" required></div>
      <div class="form-group"><label>Email</label><input type="email" class="form-control" name="email" required></div>
      <div class="form-group"><label>Phone (optional)</label><input class="form-control" name="phone"></div>
      <div class="form-row">
        <div class="form-group"><label>Password</label><input type="password" class="form-control" name="password" required minlength="6"></div>
        <div class="form-group"><label>Confirm</label><input type="password" class="form-control" name="password_confirm" required minlength="6"></div>
      </div>
      <button class="btn btn-primary btn-block">Create account</button>
      <p class="muted text-center mt-2">Already a regular? <a href="/login/">Sign in</a></p>
    </form>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = Object.fromEntries(new FormData(e.target).entries());
  try {
    const r = await BB.register(payload);
    BB.setTokens(r.tokens); BB.setUser(r.user);
    toast('Account created! ✂️', 'success');
    setTimeout(()=> location.href = '/dashboard/', 500);
  } catch (err) {
    const d = err.data;
    let msg = 'Registration failed';
    if (d && typeof d === 'object') msg = Object.entries(d).map(([k,v])=>`${k}: ${Array.isArray(v)?v.join(' '):v}`).join(' · ');
    toast(msg, 'error');
  }
});
</script>
{% endblock %}
